<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel partners — DeedFlow</title>
<meta name="description" content="DeedFlow is the compliant sales CRM for Indian property developers — leads, inventory, pricing, RERA, escrow, TDS and channel partners in one flow.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/partners.css">
</head>
<body>
<div id="app"></div>

<template id="tpl">
<div class="rx">

<header style="position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: color-mix(in oklab, var(--bg) 84%, transparent); border-bottom: 1px solid var(--line)">
<div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 36px">
<a href="index.html" aria-label="DeedFlow home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink)">
<svg class="lm-l" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tspa1s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d"></stop><stop offset="1" stop-color="#ff5f00"></stop></linearGradient></defs><path d="M20 44V12l8-6v38z" fill="#0a1628"></path><path d="M8 40c6-10 14-16 34-18-14 6-22 12-27 22z" fill="url(#tspa1s)"></path><path d="M30 44V18l6 4v22z" fill="#0a1628" opacity=".7"></path></svg><svg class="lm-d" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tspa1ds" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d"></stop><stop offset="1" stop-color="#ff5f00"></stop></linearGradient></defs><path d="M20 44V12l8-6v38z" fill="#ffffff"></path><path d="M8 40c6-10 14-16 34-18-14 6-22 12-27 22z" fill="url(#tspa1ds)"></path><path d="M30 44V18l6 4v22z" fill="#ffffff" opacity=".7"></path></svg><span style="font-weight: 800; font-size: 22px; letter-spacing: -0.04em">Deed<span style="color: var(--acct)">Flow</span></span>
</a>
<nav class="hide-m" aria-label="Main" style="display: flex; gap: 28px; font-size: 14.5px; font-weight: 500">
<a class="nl" href="features.html">Product</a>
<a class="nl" href="compliance.html">Compliance</a>
<a class="nl" data-on="1" href="partners.html">Channel partners</a>
<a class="nl" href="pricing.html">Pricing</a>
<a class="nl" href="company.html">Company</a>
</nav>
<div style="margin-left: auto; display: flex; gap: 10px; align-items: center">
<div class="hide-m" style="position: relative">
<button class="nl" onClick="{{toggleLogin}}" aria-haspopup="true" aria-expanded="{{loginExp}}" style="background: none; border: 0; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px">Log in<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{loginRot}}); transition: transform .25s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{loginOpen}}" hint-placeholder-val="{{ false }}">
<div class="swap" role="menu" aria-label="Choose your portal" style="position: absolute; right: 0; top: calc(100% + 10px); width: 320px; background: var(--surf); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow), 0 30px 60px -20px rgba(10,22,40,0.35); padding: 8px; display: flex; flex-direction: column; gap: 2px; z-index: 70; text-align: left">
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub); padding: 10px 12px 6px">LOG IN AS</span>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--accsoft); color: var(--acct)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Developer team</span><span style="font-size: 12.5px; color: var(--sub)">Sales, presales, CRM and accounts</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--oksoft); color: var(--ok)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Channel partner</span><span style="font-size: 12.5px; color: var(--sub)">Brokers and their agents</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--bluesoft); color: var(--blue)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Home buyer</span><span style="font-size: 12.5px; color: var(--sub)">Booking, payments and documents</span></span></a>
<div style="border-top: 1px solid var(--line); margin-top: 6px; padding: 12px 12px 6px; font-size: 13px; color: var(--mut)">New to DeedFlow? <a href="signup.html" style="font-weight: 650">Start free trial →</a></div>
</div>
</sc-if>
</div>
<a class="nl hide-m" href="company.html" style="font-weight: 600; font-size: 14.5px">Book a demo</a>
<a class="bp" href="signup.html" style="padding: 11px 18px; font-size: 14.5px">Start free trial</a>
</div>
</div>
</header>

<!-- HERO -->
<section style="position: relative; padding: 96px 24px 96px; overflow: hidden">
<div class="grid-bg" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.7"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div style="flex: 1 1 500px; display: flex; flex-direction: column; gap: 24px; min-width: 0">
<span class="eyebrow in">Channel partner ecosystem</span>
<h1 class="in d1" style="margin: 0; font-size: clamp(40px, 5.6vw, 72px); line-height: 1; letter-spacing: -0.045em; font-weight: 800; text-wrap: balance">Brokers bring buyers. DeedFlow keeps the score fair.</h1>
<p class="lead in d2" style="font-size: 19px; max-width: 580px">Verified KYC, clear lead ownership, commission slabs and payout runs with TDS. Partners and their agents see it all in their own portal, so your team stops settling disputes on WhatsApp.</p>
<div class="in d3 stack-m" style="display: flex; gap: 12px"><a class="bp" href="company.html">See the partner portal</a><a class="bs" href="#slabs">Try the commission calculator</a></div>
</div>
<div class="in d4 hide-m" style="flex: 1 1 440px; position: relative; min-height: 530px">
<div class="card" style="position: absolute; left: 0; right: 80px; top: 0; box-shadow: var(--shadow); overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line)"><span style="width: 30px; height: 30px; border-radius: 9px; background: #45d69a; color: #0a1628; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">SR</span><span style="font-weight: 700">Sai Realty · Partner portal</span><span class="pill p-ok" style="margin-left: auto">KYC verified</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 16px 18px">
<div style="border: 1px solid var(--line); border-radius: 12px; padding: 12px"><div style="font-size: 11.5px; color: var(--sub)">Leads registered</div><div style="font-size: 22px; font-weight: 800">64</div></div>
<div style="border: 1px solid var(--line); border-radius: 12px; padding: 12px"><div style="font-size: 11.5px; color: var(--sub)">Bookings</div><div style="font-size: 22px; font-weight: 800">5</div></div>
<div style="border: 1px solid var(--line); border-radius: 12px; padding: 12px"><div style="font-size: 11.5px; color: var(--sub)">Current slab</div><div style="font-size: 22px; font-weight: 800; color: var(--acct)">2.0%</div></div>
</div>
<sc-for list="{{heroRows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13.5px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.l}}</span><span style="font-size: 12px; color: var(--sub)">{{r.s}}</span></span><span class="pill {{r.tone}}">{{r.p}}</span></div>
</sc-for>
</div>
<div class="float" style="position: absolute; right: 0; bottom: 0; width: 250px; background: #0a1628; color: #edf1f7; border-radius: 18px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; color: #a9b5c6; font-weight: 600">OCTOBER PAYOUT</span>
<span class="mono" style="font-size: 26px; font-weight: 700">₹3,03,800</span>
<span style="font-size: 12px; color: #a9b5c6">Gross ₹3,10,000 · TDS 194H ₹6,200</span>
<span class="coin" style="right: 24px; bottom: 30px">₹</span><span class="coin" style="right: 54px; bottom: 30px; animation-delay: .8s">₹</span><span class="coin" style="right: 84px; bottom: 30px; animation-delay: 1.6s">₹</span>
</div>
</div>
</div>
</section>

<!-- ONBOARDING -->
<section style="padding: 80px 24px; background: var(--bg2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line)">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div class="rv" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 700px"><span class="eyebrow">Onboarding</span><h2 class="h2">From sign-up to first lead, verified at every step.</h2></div>
<p class="lead" style="max-width: 420px">KYC runs through SurePass and DigiLocker, so you never chase photocopies of PAN cards again.</p>
</div>
<div class="rv" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
<button class="step" data-on="{{st.on}}" onClick="{{st.pick}}"><span class="mono" style="font-size: 12px; color: var(--acct); font-weight: 600">STEP {{st.n}}</span><span style="font-size: 18px; font-weight: 750">{{st.t}}</span><span style="font-size: 13.5px; color: var(--mut); line-height: 1.5">{{st.d}}</span></button>
</sc-for>
</div>
<div class="card swap" style="padding: 28px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px; min-width: 0"><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">{{step.t}}</span><span style="font-size: 15px; color: var(--mut); line-height: 1.6">{{step.long}}</span></div>
<div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<sc-for list="{{step.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 13px 16px; font-size: 14px"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.l}}</span><span class="mono" style="font-size: 12px; color: var(--sub)">{{r.s}}</span></span><span class="pill {{r.tone}}">{{r.p}}</span></div>
</sc-for>
</div>
</div>
</div>
</section>

<!-- LEAD REGISTRATION -->
<section style="padding: 104px 24px 80px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div class="rv" style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<span class="eyebrow">Lead registration</span>
<h2 class="h2">Who brought the buyer? The system already knows.</h2>
<p class="lead">Partners register a lead before the site visit. DeedFlow checks it against existing leads and other partners' registrations, and records ownership with a timestamp.</p>
</div>
<div class="rv" style="flex: 1.1 1 480px; min-width: 0">
<div class="card" style="padding: 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 20px">
<span style="font-weight: 750; font-size: 17px">Register a lead · Greenfield Enclave</span>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: var(--mut)">Try a buyer mobile number</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{phones}}" as="p" hint-placeholder-count="3"><button class="chip" data-on="{{p.on}}" onClick="{{p.pick}}"><span class="mono">{{p.l}}</span></button></sc-for></div></div>
<div style="display: flex; gap: 10px" class="stack-m">
<label for="ph" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buyer mobile</label>
<input id="ph" class="field" value="{{phone}}" readonly="{{ true }}">
<button class="bp" onClick="{{check}}" style="flex: none">{{checkBtn}}</button>
</div>
<sc-if value="{{checking}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--mut)"><span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ff5f00; border-top-color: transparent; animation: spin .7s linear infinite"></span>Checking leads, partner registrations and dedupe window…</div></sc-if>
<sc-if value="{{hasResult}}" hint-placeholder-val="{{ true }}">
<div class="swap" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 16px; background: {{res.bg}}">
<span style="display: flex; align-items: center; gap: 10px"><span class="pill {{res.tone}}" style="font-size: 12.5px">{{res.tag}}</span><span style="font-weight: 700; font-size: 15px">{{res.t}}</span></span>
<span style="font-size: 14px; color: var(--mut); line-height: 1.55">{{res.d}}</span>
<span class="mono" style="font-size: 12px; color: var(--sub)">{{res.meta}}</span>
</div>
</sc-if>
</div>
</div>
</div>
</section>

<!-- SLABS -->
<section id="slabs" class="on-navy" style="padding: 104px 24px; position: relative; overflow: hidden">
<div class="grid-bg" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.45"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px">
<div class="rv" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px"><span class="eyebrow">Commission slabs &amp; payouts</span><h2 class="h2">Slabs that reward volume. Payouts with TDS already deducted.</h2></div>
<p class="lead" style="max-width: 420px">Set slabs per project. Payout runs compute gross commission, deduct TDS under 194H, and post to the ledger.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 18px">
<div class="rv" style="flex: 1 1 420px; min-width: 0; background: var(--surf); border: 1px solid var(--line); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="bk" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>Bookings this quarter</span><span class="mono">{{bookings}}</span></label><input id="bk" type="range" min="1" max="20" value="{{bookings}}" onInput="{{setBk}}" onChange="{{setBk}}"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="av" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>Average agreement value</span><span class="mono">{{avgL}}</span></label><input id="av" type="range" min="4000000" max="30000000" step="500000" value="{{avg}}" onInput="{{setAvg}}" onChange="{{setAvg}}"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">SLABS · SAMPLE CONFIGURATION</span>
<sc-for list="{{slabs}}" as="sl" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid {{sl.bd}}; background: {{sl.bg}}; transition: all .3s"><span style="flex: 1; font-size: 14px; font-weight: 600">{{sl.l}}</span><span class="mono" style="font-weight: 700; color: {{sl.c}}">{{sl.p}}</span></div>
</sc-for>
</div>
</div>
<div class="rv" style="flex: 1 1 440px; min-width: 0; background: var(--surf); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7)">
<div style="padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 750; font-size: 16px">Payout run · Q3</span><span style="font-size: 12.5px; color: var(--sub)">Sai Realty · {{bookings}} bookings</span></span><span class="pill p-warn">Ready to approve</span></div>
<sc-for list="{{payout}}" as="r" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); font-size: 14px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.l}}</span><span style="font-size: 12px; color: var(--sub)">{{r.s}}</span></span><span class="mono" style="font-weight: 600; color: {{r.c}}">{{r.v}}</span></div>
</sc-for>
<div style="padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; background: var(--surf2); margin-top: auto"><span style="font-weight: 700">Net payout</span><span class="mono" style="font-size: 28px; font-weight: 800">{{net}}</span></div>
</div>
</div>
</div>
</section>

<!-- AGENTS + BENEFITS -->
<section style="padding: 104px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div class="rv" style="display: flex; flex-direction: column; gap: 16px; max-width: 760px"><span class="eyebrow">For both sides</span><h2 class="h2">What changes for your team, and for your partners.</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 18px">
<div class="card rv" style="padding: 32px; display: flex; flex-direction: column; gap: 18px">
<span class="pill p-blue" style="align-self: flex-start">Developer</span>
<sc-for list="{{forDev}}" as="b" hint-placeholder-count="4"><div style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff5f00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5L20 7"></path></svg><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">{{b.t}}</span><span style="color: var(--mut); font-size: 14px; line-height: 1.5">{{b.d}}</span></span></div></sc-for>
</div>
<div class="card rv" style="padding: 32px; display: flex; flex-direction: column; gap: 18px">
<span class="pill p-ok" style="align-self: flex-start">Channel partner &amp; agents</span>
<sc-for list="{{forCP}}" as="b" hint-placeholder-count="4"><div style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff5f00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5L20 7"></path></svg><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">{{b.t}}</span><span style="color: var(--mut); font-size: 14px; line-height: 1.5">{{b.d}}</span></span></div></sc-for>
</div>
</div>
</div>
</section>

<section style="padding: 0 24px 96px">
<div class="on-navy rv" style="max-width: 1240px; margin: 0 auto; border-radius: 32px; padding: 72px 48px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; width: 520px; height: 520px; right: -120px; top: -260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,95,0,0.35), rgba(255,95,0,0) 65%)"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 640px"><h2 class="h2">Bring your partner network onto one portal.</h2><p class="lead">We will set up your slabs and KYC flow in the demo.</p></div>
<div class="stack-m" style="position: relative; display: flex; gap: 12px"><a class="bp" href="signup.html" style="padding: 15px 26px; font-size: 16px">Start free trial</a><a class="bs" href="company.html" style="padding: 15px 26px; font-size: 16px">Book a demo</a></div>
</div>
</section>

<footer style="border-top: 1px solid var(--line); padding: 40px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--sub)"><span>© 2026 DeedFlow. All rights reserved.</span><span style="display: flex; gap: 20px"><a class="nl" href="index.html">Home</a><a class="nl" href="features.html">Product</a><a class="nl" href="pricing.html">Pricing</a><a class="nl" href="company.html">Contact</a></span></div>
</footer>

</div>
</template>

<script src="js/runtime.js"></script>
<script src="js/partners.js"></script>
</body>
</html>
