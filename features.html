<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — DeedFlow</title>
<meta name="description" content="DeedFlow is the compliant sales CRM for Indian property developers — leads, inventory, pricing, RERA, escrow, TDS and channel partners in one flow.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/features.css">
</head>
<body>
<div id="app"></div>

<template id="tpl">
<div class="rx">

<header style="position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: color-mix(in oklab, var(--bg) 84%, transparent); border-bottom: 1px solid var(--line)">
<div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 36px">
<a href="index.html" aria-label="DeedFlow home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink)">
<svg class="lm-l" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tsfe1s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d"></stop><stop offset="1" stop-color="#ff5f00"></stop></linearGradient></defs><path d="M20 44V12l8-6v38z" fill="#0a1628"></path><path d="M8 40c6-10 14-16 34-18-14 6-22 12-27 22z" fill="url(#tsfe1s)"></path><path d="M30 44V18l6 4v22z" fill="#0a1628" opacity=".7"></path></svg><svg class="lm-d" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tsfe1ds" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d"></stop><stop offset="1" stop-color="#ff5f00"></stop></linearGradient></defs><path d="M20 44V12l8-6v38z" fill="#ffffff"></path><path d="M8 40c6-10 14-16 34-18-14 6-22 12-27 22z" fill="url(#tsfe1ds)"></path><path d="M30 44V18l6 4v22z" fill="#ffffff" opacity=".7"></path></svg><span style="font-weight: 800; font-size: 22px; letter-spacing: -0.04em">Deed<span style="color: var(--acct)">Flow</span></span>
</a>
<nav class="hide-m" aria-label="Main" style="display: flex; gap: 28px; font-size: 14.5px; font-weight: 500">
<a class="nl" data-on="1" href="features.html">Product</a>
<a class="nl" href="compliance.html">Compliance</a>
<a class="nl" href="partners.html">Channel partners</a>
<a class="nl" href="pricing.html">Pricing</a>
<a class="nl" href="company.html">Company</a>
</nav>
<div style="margin-left: auto; display: flex; gap: 10px; align-items: center">
<div class="hide-m" style="position: relative">
<button class="nl" onClick="{{toggleLogin}}" aria-haspopup="true" aria-expanded="{{loginExp}}" style="background: none; border: 0; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px">Log in<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{loginRot}}); transition: transform .25s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{loginOpen}}" hint-placeholder-val="{{ false }}">
<div class="swap" role="menu" aria-label="Choose your portal" style="position: absolute; right: 0; top: calc(100% + 10px); width: 320px; background: var(--surf); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow), 0 30px 60px -20px rgba(10,22,40,0.35); padding: 8px; display: flex; flex-direction: column; gap: 2px; z-index: 70; text-align: left">
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub); padding: 10px 12px 6px">LOG IN AS</span>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--accsoft); color: var(--acct)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Developer team</span><span style="font-size: 12.5px; color: var(--sub)">Sales, presales, CRM and accounts</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--oksoft); color: var(--ok)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Channel partner</span><span style="font-size: 12.5px; color: var(--sub)">Brokers and their agents</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--bluesoft); color: var(--blue)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Home buyer</span><span style="font-size: 12.5px; color: var(--sub)">Booking, payments and documents</span></span></a>
<div style="border-top: 1px solid var(--line); margin-top: 6px; padding: 12px 12px 6px; font-size: 13px; color: var(--mut)">New to DeedFlow? <a href="signup.html" style="font-weight: 650">Start free trial →</a></div>
</div>
</sc-if>
</div>
<a class="nl hide-m" href="company.html" style="font-weight: 600; font-size: 14.5px">Book a demo</a>
<a class="bp" href="signup.html" style="padding: 11px 18px; font-size: 14.5px">Start free trial</a>
</div>
</div>
</header>

<!-- HERO -->
<section style="position: relative; padding: 96px 24px 56px; overflow: hidden">
<div class="grid-bg" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.7"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<span class="eyebrow in">Product</span>
<h1 class="in d1" style="margin: 0; font-size: clamp(40px, 6vw, 76px); line-height: 1; letter-spacing: -0.045em; font-weight: 800; max-width: 980px; text-wrap: balance">Every module a developer's sales floor needs. Try them right here.</h1>
<p class="lead in d2" style="max-width: 680px; font-size: 19px">Each section below is a working slice of the product. Pick a lead, place a call, hold a unit, build a cost sheet.</p>
<nav class="in d3" aria-label="Modules" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
<sc-for list="{{jump}}" as="j" hint-placeholder-count="7">
<a href="{{j.href}}" class="chip" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px"><span class="mono" style="font-size: 11px; color: var(--acct)">{{j.n}}</span>{{j.l}}</a>
</sc-for>
</nav>
</div>
</section>

<!-- 01 LEADS -->
<section id="leads" style="padding: 72px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
<div class="rv" style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<span class="eyebrow">01 · Lead capture &amp; scoring</span>
<h2 class="h2">Rule score and AI score, side by side. You decide who to trust.</h2>
<p class="lead">Leads from 99acres, MagicBricks, Housing, IndiaMART, Meta and Google lead ads are deduplicated at capture, then scored twice. Your rules stay in charge; the AI score gives a second opinion.</p>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<sc-for list="{{leadList}}" as="l" hint-placeholder-count="4">
<button class="sel" data-on="{{l.on}}" onClick="{{l.pick}}">
<span style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--mut)">{{l.ini}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 650; font-size: 14.5px">{{l.name}}</span><span style="font-size: 12.5px; color: var(--sub)">{{l.src}} · {{l.want}}</span></span>
<span class="pill {{l.tone}}">{{l.pri}}</span>
</button>
</sc-for>
</div>
</div>
<div class="rv" style="flex: 1.3 1 520px; min-width: 0">
<div class="card swap" style="padding: 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><span style="font-weight: 750; font-size: 18px">{{lead.name}}</span><span style="font-size: 13px; color: var(--sub)">{{lead.src}} · captured {{lead.when}}</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 16px">
<div style="border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 18px">
<svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="Rule score {{lead.rule}}"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="8"></circle><circle cx="42" cy="42" r="34" fill="none" stroke="var(--sub)" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="{{lead.ruleOff}}" transform="rotate(-90 42 42)" style="transition: stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)"></circle><text x="42" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="Inter">{{lead.rule}}</text></svg>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700">Rule score</span><span style="font-size: 13px; color: var(--sub); line-height: 1.45">From the weights your sales head configured</span></div>
</div>
<div style="border: 1px solid color-mix(in oklab, #ff5f00 45%, var(--line)); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 18px; background: color-mix(in oklab, #ff5f00 4%, var(--surf))">
<svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="AI score {{lead.ai}}"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="8"></circle><circle cx="42" cy="42" r="34" fill="none" stroke="#ff5f00" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="{{lead.aiOff}}" transform="rotate(-90 42 42)" style="transition: stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)"></circle><text x="42" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="Inter">{{lead.ai}}</text></svg>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700">AI score</span><span style="font-size: 13px; color: var(--sub); line-height: 1.45">Independent read of behaviour and intent</span></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">WHY THIS SCORE</span>
<sc-for list="{{lead.factors}}" as="f" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; font-size: 14px">
<span class="pill {{f.tone}}" style="width: 38px; justify-content: center">{{f.k}}</span>
<span style="flex: 1">{{f.t}}</span>
<span style="width: 120px; height: 6px; border-radius: 6px; background: var(--bg2); overflow: hidden" class="hide-m"><span style="display: block; height: 100%; width: {{f.w}}; background: {{f.c}}; border-radius: 6px; transition: width .6s"></span></span>
<span class="mono" style="width: 34px; text-align: right; font-weight: 600">{{f.v}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--bg2); font-size: 14px"><span class="pill {{lead.tone}}">{{lead.pri}}</span><span style="color: var(--mut)">{{lead.next}}</span></div>
</div>
</div>
</div>
</section>

<!-- 02 PRESALES -->
<section id="presales" style="padding: 72px 24px; background: var(--bg2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line)">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap-reverse; gap: 56px; align-items: center">
<div class="rv" style="flex: 1.2 1 520px; min-width: 0; display: flex; flex-wrap: wrap; gap: 18px">
<div class="card" style="flex: 1 1 260px; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center">
<span class="pill {{callTone}}"><sc-if value="{{onCall}}" hint-placeholder-val="{{ false }}"><span class="dotg"></span></sc-if>{{callState}}</span>
<span style="width: 64px; height: 64px; border-radius: 50%; background: var(--accsoft); color: var(--acct); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">VS</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 750; font-size: 18px">Vikram Singh</span><span class="mono" style="font-size: 13px; color: var(--sub)">+91 98XXX XX214 · HOT</span></span>
<span class="mono" style="font-size: 30px; font-weight: 600; letter-spacing: 0.02em">{{callTime}}</span>
<div class="bar" aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 26px; opacity: {{waveOp}}">
<span style="height: 60%"></span><span style="height: 100%; animation-delay: .1s"></span><span style="height: 70%; animation-delay: .2s"></span><span style="height: 90%; animation-delay: .3s"></span><span style="height: 50%; animation-delay: .4s"></span><span style="height: 80%; animation-delay: .15s"></span><span style="height: 100%; animation-delay: .25s"></span><span style="height: 60%; animation-delay: .35s"></span><span style="height: 85%; animation-delay: .05s"></span><span style="height: 70%; animation-delay: .45s"></span><span style="height: 95%; animation-delay: .2s"></span><span style="height: 55%; animation-delay: .3s"></span>
</div>
<button class="callbtn {{callBtnCls}}" onClick="{{toggleCall}}" aria-label="{{callBtnLabel}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="transform: rotate({{callRot}}); transition: transform .3s"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"></path></svg></button>
<span style="font-size: 12px; color: var(--sub)">Recording starts only after consent is captured</span>
</div>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">DISPOSITION</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{dispositions}}" as="d" hint-placeholder-count="6">
<button class="chip" data-on="{{d.on}}" onClick="{{d.pick}}">{{d.l}}</button>
</sc-for>
</div>
<span style="font-size: 13px; color: var(--mut)">{{dispNext}}</span>
</div>
<div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">AI CALL ANALYSIS</span><span class="pill {{aiTone}}">{{aiState}}</span></div>
<sc-if value="{{aiReady}}" hint-placeholder-val="{{ true }}">
<div class="swap" style="display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<div style="display: flex; justify-content: space-between"><span style="color: var(--mut)">Sentiment</span><span style="font-weight: 650">Positive, price-sensitive</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: var(--mut)">Budget mentioned</span><span class="mono" style="font-weight: 600">₹1.0 – 1.2 Cr</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: var(--mut)">Interest</span><span style="font-weight: 650">3 BHK, Riverside Towers</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: var(--mut)">Suggested next step</span><span style="font-weight: 650; color: var(--acct)">Weekend site visit</span></div>
</div>
</sc-if>
<sc-if value="{{aiWaiting}}" hint-placeholder-val="{{ false }}"><div style="font-size: 13.5px; color: var(--sub)">End the call to see the analysis land on the lead.</div></sc-if>
</div>
</div>
</div>
<div class="rv" style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<span class="eyebrow">02 · Presales &amp; call centre</span>
<h2 class="h2">A call centre in a browser tab.</h2>
<p class="lead">Browser softphone, click-to-call from any lead, consented recording, dispositions and a live queue. When the call ends, AI analysis is written straight onto the lead.</p>
<p style="margin: 0; font-size: 14.5px; color: var(--sub)">Try it: press the call button, then end the call and pick a disposition.</p>
</div>
</div>
</section>

<!-- 03 SITE VISITS -->
<section id="visits" style="padding: 96px 24px 72px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px">
<div class="rv" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 680px"><span class="eyebrow">03 · Site visits</span><h2 class="h2">Reminders at T-1 day and T-2 hours. Feedback before the car leaves.</h2></div>
<p class="lead" style="max-width: 420px">No-shows drop when buyers are reminded at the right time. Structured feedback makes the next call specific.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 18px">
<div class="card rv" style="flex: 1 1 520px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 0">
<sc-for list="{{visitSteps}}" as="v" hint-placeholder-count="5">
<div style="display: flex; gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center"><span style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{v.bg}}; color: {{v.fg}}; font-size: 12px; font-weight: 700; flex: none">{{v.n}}</span><span style="width: 2px; flex: 1; min-height: 26px; background: {{v.lineC}}"></span></div>
<div style="padding-bottom: 22px; display: flex; flex-direction: column; gap: 4px; flex: 1"><span style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap"><span style="font-weight: 700; font-size: 15.5px">{{v.t}}</span><span class="mono" style="font-size: 12.5px; color: var(--sub)">{{v.when}}</span></span><span style="font-size: 14px; color: var(--mut)">{{v.d}}</span></div>
</div>
</sc-for>
</div>
<div class="card rv" style="flex: 1 1 420px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 750; font-size: 17px">Visit feedback · Priya Sharma</span><span class="pill p-blue">Tower B</span></div>
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">LIKED</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{liked}}" as="c" hint-placeholder-count="4"><button class="chip" data-on="{{c.on}}" onClick="{{c.pick}}">{{c.l}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">OBJECTIONS</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{objections}}" as="c" hint-placeholder-count="4"><button class="chip" data-on="{{c.on}}" onClick="{{c.pick}}">{{c.l}}</button></sc-for></div></div>
<div style="margin-top: auto; padding: 16px; border-radius: 14px; background: var(--bg2); display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">AUTO NEXT STEP</span><span style="font-size: 14.5px; font-weight: 600">{{visitNext}}</span></div>
</div>
</div>
</div>
</section>

<!-- 04 INVENTORY -->
<section id="inventory" style="padding: 72px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
<div class="rv" style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<span class="eyebrow">04 · Inventory</span>
<h2 class="h2">Project › Tower › Floor › Unit. Live, for everyone.</h2>
<p class="lead">Generate a whole tower in bulk, then watch availability change as holds are placed and bookings land. Holds expire on their own, so stale blocks never freeze stock.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 13.5px; margin-top: 6px">
<span style="display: flex; align-items: center; gap: 8px"><span class="u-av" style="width: 16px; height: 16px; border-radius: 5px"></span>Available</span>
<span style="display: flex; align-items: center; gap: 8px"><span class="u-hold" style="width: 16px; height: 16px; border-radius: 5px"></span>On hold</span>
<span style="display: flex; align-items: center; gap: 8px"><span class="u-bk" style="width: 16px; height: 16px; border-radius: 5px"></span>Booked</span>
<span style="display: flex; align-items: center; gap: 8px"><span class="u-bl" style="width: 16px; height: 16px; border-radius: 5px; border: 1px solid var(--line)"></span>Blocked by management</span>
</div>
</div>
<div class="rv" style="flex: 1.5 1 600px; min-width: 0">
<div class="card" style="box-shadow: var(--shadow); overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line)">
<span style="font-weight: 750">Skyline Residences</span>

<div style="padding: 18px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><button class="{{freezeCls}}" onClick="{{toggleFreeze}}">{{freezeBtn}}</button><span style="font-size: 13px; color: var(--sub)">{{freezeNote}}</span></div>
