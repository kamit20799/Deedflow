<body>
<div id="app"></div>

<template id="tpl">
<div class="rx">

<header style="position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: color-mix(in oklab, var(--bg) 84%, transparent); border-bottom: 1px solid var(--line)">
<div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 36px">
<a href="index.html" aria-label="DeedFlow home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink)">
<svg class="lm-l" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tsco1s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d"></stop><stop offset="1" stop-color="#ff5f00"></stop></linearGradient></defs><path d="M20 44V12l8-6v38z" fill="#0a1628"></path><path d="M8 40c6-10 14-16 34-18-14 6-22 12-27 22z" fill="url(#tsco1s)"></path><path d="M30 44V18l6 4v22z" fill="#0a1628" opacity=".7"></path></svg><svg class="lm-d" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tsco1ds" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d"></stop><stop offset="1" stop-color="#ff5f00"></stop></linearGradient></defs><path d="M20 44V12l8-6v38z" fill="#ffffff"></path><path d="M8 40c6-10 14-16 34-18-14 6-22 12-27 22z" fill="url(#tsco1ds)"></path><path d="M30 44V18l6 4v22z" fill="#ffffff" opacity=".7"></path></svg><span style="font-weight: 800; font-size: 22px; letter-spacing: -0.04em">Deed<span style="color: var(--acct)">Flow</span></span>
</a>
<nav class="hide-m" aria-label="Main" style="display: flex; gap: 28px; font-size: 14.5px; font-weight: 500">
<a class="nl" href="features.html">Product</a>
<a class="nl" data-on="1" href="compliance.html">Compliance</a>
<a class="nl" href="partners.html">Channel partners</a>
<a class="nl" href="pricing.html">Pricing</a>
<a class="nl" href="company.html">Company</a>
</nav>
<div style="margin-left: auto; display: flex; gap: 10px; align-items: center">
<div class="hide-m" style="position: relative">
<button class="nl" onClick="{{toggleLogin}}" aria-haspopup="true" aria-expanded="{{loginExp}}" style="background: none; border: 0; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px">Log in<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{loginRot}}); transition: transform .25s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{loginOpen}}" hint-placeholder-val="{{ false }}">
<div class="swap" role="menu" aria-label="Choose your portal" style="position: absolute; right: 0; top: calc(100% + 10px); width: 320px; background: var(--surf); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow), 0 30px 60px -20px rgba(10,22,40,0.35); padding: 8px; display: flex; flex-direction: column; gap: 2px; z-index: 70; text-align: left">
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub); padding: 10px 12px 6px">LOG IN AS</span>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--accsoft); color: var(--acct)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Developer team</span><span style="font-size: 12.5px; color: var(--sub)">Sales, presales, CRM and accounts</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--oksoft); color: var(--ok)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Channel partner</span><span style="font-size: 12.5px; color: var(--sub)">Brokers and their agents</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--bluesoft); color: var(--blue)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Home buyer</span><span style="font-size: 12.5px; color: var(--sub)">Booking, payments and documents</span></span></a>
<div style="border-top: 1px solid var(--line); margin-top: 6px; padding: 12px 12px 6px; font-size: 13px; color: var(--mut)">New to DeedFlow? <a href="signup.html" style="font-weight: 650">Start free trial →</a></div>
</div>
</sc-if>
</div>
<a class="nl hide-m" href="company.html" style="font-weight: 600; font-size: 14.5px">Book a demo</a>
<a class="bp" href="signup.html" style="padding: 11px 18px; font-size: 14.5px">Start free trial</a>
</div>
</div>
</header>

<!-- HERO -->
<section style="position: relative; padding: 104px 24px 112px; overflow: hidden">
<div class="grid-bg" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.7"></div>
<div aria-hidden="true" style="position: absolute; width: 620px; height: 620px; right: 4%; top: 40px; border-radius: 50%; background: radial-gradient(circle, rgba(255,95,0,0.16), rgba(255,95,0,0) 62%)"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 24px; min-width: 0">
<span class="eyebrow in">Compliance</span>
<h1 class="in d1" style="margin: 0; font-size: clamp(40px, 5.6vw, 72px); line-height: 1; letter-spacing: -0.045em; font-weight: 800; text-wrap: balance">Compliance isn't a report you run. It's how the money moves.</h1>
<p class="lead in d2" style="font-size: 19px; max-width: 600px">RERA, GST, TDS, PMLA and DPDP checks sit inside receipts, demands and payouts. A transaction that breaks a rule never posts, and every one that does is written to a strict audit trail.</p>
<div class="in d3 stack-m" style="display: flex; gap: 12px"><a class="bp" href="company.html">Walk through it with us</a><a class="bs" href="#rera">Try the checks below</a></div>
</div>
<div class="hide-m" aria-hidden="true" style="flex: 1 1 420px; display: flex; justify-content: center">
<div style="position: relative; width: 440px; height: 440px">
<div class="orbit" style="position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgba(255,95,0,0.45)">
<sc-for list="{{orbitA}}" as="o" hint-placeholder-count="3"><span style="position: absolute; left: {{o.x}}; top: {{o.y}}; transform: translate(-50%, -50%)"><span class="counter" style="display: inline-block; background: var(--surf); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 650; white-space: nowrap">{{o.t}}</span></span></sc-for>
</div>
<div class="orbit2" style="position: absolute; inset: 80px; border-radius: 50%; border: 1px dashed rgba(255,95,0,0.3)">
<sc-for list="{{orbitB}}" as="o" hint-placeholder-count="3"><span style="position: absolute; left: {{o.x}}; top: {{o.y}}; transform: translate(-50%, -50%)"><span class="counter" style="display: inline-block; background: var(--surf); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 650; white-space: nowrap">{{o.t}}</span></span></sc-for>
</div>
<div class="shield" style="position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 36px; background: #ff5f00; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 14px rgba(255,95,0,0.14), 0 30px 60px -10px rgba(255,95,0,0.55)">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0a1628" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>
</div>
</div>
</div>
</div>
</section>

<!-- RERA S13 -->
<section id="rera" style="padding: 112px 24px 80px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
<div class="rv" style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<span class="eyebrow">RERA · Section 13</span>
<h2 class="h2">No receipt crosses 10% before the agreement is registered.</h2>
<p class="lead">Section 13 of RERA limits what a promoter can take as advance or application fee to 10% of the cost until a written agreement for sale is registered. DeedFlow checks this at the moment a receipt is entered, not at month-end.</p>
<p style="margin: 0; font-size: 14.5px; color: var(--sub)">Move the sliders to see what your team would see.</p>
</div>
<div class="rv" style="flex: 1.2 1 520px; min-width: 0">
<div class="card" style="padding: 32px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="cost" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>Unit cost</span><span class="mono">{{costL}}</span></label><input id="cost" type="range" min="3000000" max="50000000" step="100000" value="{{cost}}" onInput="{{setCost}}" onChange="{{setCost}}"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="recv" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>New receipt amount</span><span class="mono">{{recvL}}</span></label><input id="recv" type="range" min="0" max="{{recvMax}}" step="50000" value="{{recv}}" onInput="{{setRecv}}" onChange="{{setRecv}}"></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; border-radius: 14px; background: var(--bg2)">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 650; font-size: 14.5px">Agreement for sale registered</span><span style="font-size: 12.5px; color: var(--sub)">Already collected on this unit: {{priorL}}</span></span>
<button class="sw" onClick="{{toggleAgr}}" aria-label="Agreement registered" aria-pressed="{{agrPressed}}" style="background: {{swBg}}"><span style="left: {{swLeft}}"></span></button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 14px; border-radius: 14px; background: var(--bg2); overflow: hidden">
<span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{priorW}}; background: var(--sub); transition: width .4s"></span>
<span style="position: absolute; top: 0; bottom: 0; left: {{priorW}}; width: {{recvW}}; background: {{recvC}}; transition: all .4s"></span>
</div>
<div class="mono" style="display: flex; justify-content: space-between; font-size: 12px; color: var(--sub)"><span>₹0</span><span>{{capText}}</span></div>
</div>
<div class="swap" style="display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: 16px; background: {{verdictBg}}; border: 1px solid {{verdictBorder}}">
<span class="pill {{verdictTone}}" style="font-size: 12.5px">{{verdictTag}}</span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 15px">{{verdictTitle}}</span><span style="font-size: 13.5px; color: var(--mut)">{{verdictDesc}}</span></span>
</div>
</div>
</div>
</div>
</section>

<!-- ESCROW + GST -->
<section style="padding: 40px 24px 80px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 18px">
<div class="card rv" style="flex: 1 1 520px; min-width: 0; padding: 36px; display: flex; flex-direction: column; gap: 22px">
<span class="eyebrow">RERA escrow &amp; filings</span>
<h3 style="margin: 0; font-size: 28px; letter-spacing: -0.03em; font-weight: 800; line-height: 1.15">Every receipt is split at source.</h3>
<p style="margin: 0; font-size: 15.5px; color: var(--mut); line-height: 1.6">RERA requires 70% of amounts realised from allottees to go into a separate account for the project. DeedFlow routes the split as the receipt clears and keeps project filings tracked alongside.</p>
<div style="display: flex; flex-direction: column; align-items: center; gap: 0; padding-top: 6px">
<div style="background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; display: flex; gap: 12px; align-items: center"><span style="font-size: 13px; color: var(--sub)">Receipt cleared</span><span class="mono" style="font-weight: 700">{{escrowTotal}}</span></div>
<div style="display: flex; gap: 140px" aria-hidden="true"><span class="pipe" style="width: 3px; height: 48px; border-radius: 3px"></span><span class="pipe" style="width: 3px; height: 48px; border-radius: 3px; opacity: .45"></span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%">
<div style="border: 1.5px solid #ff5f00; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; background: color-mix(in oklab, #ff5f00 6%, var(--surf))"><span style="font-size: 12px; font-weight: 700; color: var(--acct)">RERA ACCOUNT · 70%</span><span class="mono" style="font-size: 20px; font-weight: 700">{{escrow70}}</span><span style="font-size: 12px; color: var(--sub)">Land and construction cost only</span></div>
<div style="border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; color: var(--sub)">COLLECTION ACCOUNT · 30%</span><span class="mono" style="font-size: 20px; font-weight: 700">{{escrow30}}</span><span style="font-size: 12px; color: var(--sub)">Operations</span></div>
</div>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{escrowAmts}}" as="e" hint-placeholder-count="3"><button class="chip" data-on="{{e.on}}" onClick="{{e.pick}}">{{e.l}}</button></sc-for></div>
</div>
<div class="card rv" style="flex: 1 1 420px; min-width: 0; padding: 36px; display: flex; flex-direction: column; gap: 22px">
<span class="eyebrow">GST &amp; e-invoicing</span>
<h3 style="margin: 0; font-size: 28px; letter-spacing: -0.03em; font-weight: 800; line-height: 1.15">Tax on every demand. IRN on every invoice.</h3>
<p style="margin: 0; font-size: 15.5px; color: var(--mut); line-height: 1.6">GST is computed from project rules on each demand letter, and e-invoices are generated with their IRN.</p>
<div style="border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; gap: 18px; background: var(--surf2); margin-top: auto">
<div aria-hidden="true" style="width: 88px; height: 88px; flex: none; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; padding: 6px; background: #fff; border-radius: 8px; box-sizing: border-box">
<sc-for list="{{qr}}" as="q" hint-placeholder-count="64"><span style="background: {{q}}; border-radius: 1px"></span></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; min-width: 0">
<span style="font-weight: 700; font-size: 14px">Tax invoice INV/26-27/0412</span>
<span class="mono" style="color: var(--sub); word-break: break-all; font-size: 11.5px">IRN 9f2c…a71e</span>
<span style="display: flex; gap: 8px; flex-wrap: wrap"><span class="pill p-ok">IRN generated</span><span class="pill p-blue">Slab 5 demand</span></span>
</div>
</div>
</div>
</div>
</section>

<!-- TDS -->
<section id="tds" class="on-navy" style="padding: 104px 24px; position: relative; overflow: hidden">
<div class="grid-bg" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.45"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div class="rv" style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<span class="eyebrow">TDS · 194-IA &amp; 194H</span>
<h2 class="h2">The TDS on both sides of a sale, worked out for you.</h2>
<p class="lead">On the buyer side, 194-IA applies when a property's consideration is ₹50 lakh or more. On the partner side, 194H applies to brokerage and commission. DeedFlow tracks both so receipts reconcile and payout runs deduct correctly.</p>
<p style="margin: 0; font-size: 13px; color: var(--sub)">Rates and thresholds shown are configured values; confirm current rates with your tax advisor.</p>
</div>
<div class="rv" style="flex: 1.1 1 480px; min-width: 0">
<div style="background: var(--surf); border: 1px solid var(--line); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7)">
<div role="tablist" aria-label="TDS section" style="display: flex; gap: 4px; background: var(--bg2); padding: 4px; border-radius: 14px; align-self: flex-start">
<button class="tab" role="tab" data-on="{{iaOn}}" onClick="{{setIA}}">194-IA · buyer</button>
<button class="tab" role="tab" data-on="{{hOn}}" onClick="{{setH}}">194H · partner</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="tdsamt" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>{{tdsLabel}}</span><span class="mono">{{tdsAmtL}}</span></label><input id="tdsamt" type="range" min="{{tdsMin}}" max="{{tdsMax}}" step="{{tdsStep}}" value="{{tdsAmt}}" onInput="{{setTds}}" onChange="{{setTds}}"></div>
<div class="swap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px">
<sc-for list="{{tdsOut}}" as="t" hint-placeholder-count="3"><div style="border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: var(--sub)">{{t.l}}</span><span class="mono" style="font-size: 19px; font-weight: 700; color: {{t.c}}">{{t.v}}</span></div></sc-for>
</div>
<div style="font-size: 13.5px; color: var(--mut); padding: 14px 16px; border-radius: 14px; background: var(--bg2)">{{tdsNote}}</div>
</div>
</div>
</div>
</section>

<!-- CANCELLATION -->
<section style="padding: 112px 24px 80px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div class="rv" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px"><span class="eyebrow">Cancellation &amp; refund</span><h2 class="h2">Refunds computed from MahaRERA forfeiture tiers.</h2></div>
<p class="lead" style="max-width: 420px">Pick when the buyer cancels. Forfeiture follows the tier you configured, and the refund reverses through the ledger.</p>
</div>
<div class="card rv" style="display: flex; flex-wrap: wrap; overflow: hidden">
<div style="flex: 1 1 460px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{tiers}}" as="t" hint-placeholder-count="4">
<button class="tab" data-on="{{t.on}}" onClick="{{t.pick}}" style="justify-content: space-between; width: 100%; padding: 16px 18px; border-color: var(--line)"><span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="color: var(--ink)">{{t.l}}</span><span style="font-size: 12.5px; font-weight: 500; color: var(--sub)">{{t.d}}</span></span><span class="mono" style="color: var(--acct)">{{t.p}}</span></button>
</sc-for>
<span style="font-size: 12.5px; color: var(--sub); margin-top: 6px">Sample tier values. Set the exact tiers from your registered agreement.</span>
</div>
<div class="swap" style="flex: 1 1 380px; min-width: 0; padding: 32px; background: var(--bg2); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px">
<span style="font-weight: 750; font-size: 17px">Cancellation · B-1204</span>
<div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<span style="display: flex; justify-content: space-between"><span style="color: var(--mut)">Paid by buyer</span><span class="mono" style="font-weight: 600">₹29,40,000</span></span>
<span style="display: flex; justify-content: space-between"><span style="color: var(--mut)">Forfeiture ({{tier.p}} of cost)</span><span class="mono" style="font-weight: 600; color: var(--bad)">{{forfeit}}</span></span>
<span style="display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px"><span style="font-weight: 700">Refund due</span><span class="mono" style="font-weight: 800; font-size: 20px">{{refund}}</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">LEDGER REVERSAL</span>
<span class="mono" style="font-size: 12.5px; color: var(--mut)">Dr Customer · Cr Bank · {{refund}}</span>
<span class="mono" style="font-size: 12.5px; color: var(--mut)">Dr Customer · Cr Forfeiture income · {{forfeit}}</span>
</div>
<span class="pill p-warn" style="align-self: flex-start; margin-top: auto">Needs Director approval</span>
</div>
</div>
</div>
</section>

<!-- PMLA / DPDP / AUDIT -->
<section style="padding: 40px 24px 112px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 18px">
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<div class="card lift rv" style="padding: 30px; display: flex; flex-direction: column; gap: 12px"><span class="eyebrow">PMLA</span><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">KYC before money moves.</span><span style="font-size: 15px; color: var(--mut); line-height: 1.6">Buyer KYC is verified and payment modes are checked on each receipt, so transactions that need review are flagged before they post.</span></div>
<div class="card lift rv" style="padding: 30px; display: flex; flex-direction: column; gap: 12px"><span class="eyebrow">DPDP</span><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Consent with a purpose.</span><span style="font-size: 15px; color: var(--mut); line-height: 1.6">Consent is captured for calls, recordings and messages, tied to a purpose and visible on the lead. Calls are recorded only with consent.</span>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px">
<sc-for list="{{consents}}" as="c" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px"><span>{{c.l}}</span><span class="pill {{c.tone}}">{{c.s}}</span></div></sc-for>
</div>
</div>
</div>
<div class="card rv" style="flex: 1.4 1 520px; min-width: 0; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 24px 26px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><span style="display: flex; flex-direction: column; gap: 4px"><span class="eyebrow">Audit trail</span><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Who changed what, and when.</span></span><span class="pill p-ok">Append-only</span></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{auditFilters}}" as="f" hint-placeholder-count="5"><button class="chip" data-on="{{f.on}}" onClick="{{f.pick}}">{{f.l}}</button></sc-for></div>
</div>
<div style="flex: 1">
<sc-for list="{{audit}}" as="a" hint-placeholder-count="6">
<div class="{{a.cls}}" style="display: grid; grid-template-columns: 74px 1fr auto; gap: 14px; align-items: center; padding: 13px 26px; border-bottom: 1px solid var(--line); font-size: 13.5px">
<span class="mono" style="font-size: 12px; color: var(--sub)">{{a.t}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">{{a.e}}</span><span style="font-size: 12px; color: var(--sub)">{{a.who}} · <span class="mono">{{a.h}}</span></span></span>
<span class="pill {{a.tone}}">{{a.m}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</section>

<section style="padding: 0 24px 96px">

</div>
