<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing — DeedFlow</title>
<meta name="description" content="DeedFlow is the compliant sales CRM for Indian property developers — leads, inventory, pricing, RERA, escrow, TDS and channel partners in one flow.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pricing.css">
</head>
<body>
<div id="app"></div>

<template id="tpl">
<div class="rx">

<header style="position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: color-mix(in oklab, var(--bg) 84%, transparent); border-bottom: 1px solid var(--line)">
<div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 36px">
<a href="index.html" aria-label="DeedFlow home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink)">
<svg class="lm-l" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tspr1s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d"></stop><stop offset="1" stop-color="#ff5f00"></stop></linearGradient></defs><path d="M20 44V12l8-6v38z" fill="#0a1628"></path><path d="M8 40c6-10 14-16 34-18-14 6-22 12-27 22z" fill="url(#tspr1s)"></path><path d="M30 44V18l6 4v22z" fill="#0a1628" opacity=".7"></path></svg><svg class="lm-d" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tspr1ds" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3d"></stop><stop offset="1" stop-color="#ff5f00"></stop></linearGradient></defs><path d="M20 44V12l8-6v38z" fill="#ffffff"></path><path d="M8 40c6-10 14-16 34-18-14 6-22 12-27 22z" fill="url(#tspr1ds)"></path><path d="M30 44V18l6 4v22z" fill="#ffffff" opacity=".7"></path></svg><span style="font-weight: 800; font-size: 22px; letter-spacing: -0.04em">Deed<span style="color: var(--acct)">Flow</span></span>
</a>
<nav class="hide-m" aria-label="Main" style="display: flex; gap: 28px; font-size: 14.5px; font-weight: 500">
<a class="nl" href="features.html">Product</a>
<a class="nl" href="compliance.html">Compliance</a>
<a class="nl" href="partners.html">Channel partners</a>
<a class="nl" data-on="1" href="pricing.html">Pricing</a>
<a class="nl" href="company.html">Company</a>
</nav>
<div style="margin-left: auto; display: flex; gap: 24px; align-items: center">
<div class="hide-m" style="position: relative" onMouseEnter="{{openLogin}}" onMouseLeave="{{closeLogin}}">
<button class="nl" onClick="{{toggleLogin}}" aria-haspopup="true" aria-expanded="{{loginExp}}" style="background: none; border: 0; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px">Log in<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{loginRot}}); transition: transform .25s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{loginOpen}}" hint-placeholder-val="{{ false }}">
<div class="swap" role="menu" aria-label="Choose your portal" style="position: absolute; right: 0; top: calc(100% + 10px); width: 320px; background: var(--surf); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow), 0 30px 60px -20px rgba(10,22,40,0.35); padding: 8px; display: flex; flex-direction: column; gap: 2px; z-index: 70; text-align: left">
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub); padding: 10px 12px 6px">LOG IN AS</span>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--accsoft); color: var(--acct)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Developer team</span><span style="font-size: 12.5px; color: var(--sub)">Sales, presales, CRM and accounts</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--oksoft); color: var(--ok)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Channel partner</span><span style="font-size: 12.5px; color: var(--sub)">Brokers and their agents</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--bluesoft); color: var(--blue)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Home buyer</span><span style="font-size: 12.5px; color: var(--sub)">Booking, payments and documents</span></span></a>
<div style="border-top: 1px solid var(--line); margin-top: 6px; padding: 12px 12px 6px; font-size: 13px; color: var(--mut)">New to DeedFlow? <a href="signup.html" style="font-weight: 650">Start free trial →</a></div>
</div>
</sc-if>
</div>
<a class="nl hide-m" href="company.html" style="font-weight: 600; font-size: 14.5px">Book a demo</a>
<a class="bp" href="signup.html" style="padding: 11px 18px; font-size: 14.5px">Start free trial</a>
</div>
</div>
</header>

<section style="position: relative; padding: 96px 24px 40px; overflow: hidden">
<div class="grid-bg" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.7"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px">
<span class="eyebrow in">Pricing</span>
<h1 class="in d1" style="margin: 0; font-size: clamp(40px, 6vw, 76px); line-height: 1; letter-spacing: -0.045em; font-weight: 800; max-width: 900px; text-wrap: balance">Pick the plan that fits your launch calendar.</h1>
<p class="lead in d2" style="max-width: 620px; font-size: 19px">Plans differ by users, projects and leads. Start free for 14 days, and save two months with annual billing.</p>
<div class="in d3" role="group" aria-label="Billing period" style="display: flex; gap: 4px; background: var(--bg2); border: 1px solid var(--line); padding: 5px; border-radius: 14px; margin-top: 8px">
<button class="tab" data-on="{{monthOn}}" onClick="{{setMonthly}}">Monthly</button>
<button class="tab" data-on="{{yearOn}}" onClick="{{setAnnual}}">Annual <span class="pill p-ok">2 months free</span></button>
</div>
</div>
</section>

<section style="padding: 32px 24px 80px">
<div style="max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(236px, 100%), 1fr)); gap: 14px; align-items: stretch">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="5">
<div class="{{p.cls}}" style="position: relative; border-radius: 22px; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px; background: {{p.bg}}; border: 1px solid {{p.border}}; color: {{p.fg}}; box-shadow: {{p.shadow}}; animation-delay: {{p.delay}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 26px"><span style="font-size: 17px; font-weight: 750">{{p.n}}</span><sc-if value="{{p.hasTag}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: {{p.tagBg}}; color: {{p.tagFg}}">{{p.tag}}</span></sc-if></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap"><span class="num" style="font-size: 32px; font-weight: 800; letter-spacing: -0.04em">{{p.price}}</span><span style="font-size: 14px; opacity: 0.75">{{p.per}}</span></span>
<span style="font-size: 13px; opacity: 0.75; min-height: 18px">{{p.sub}}</span>
</div>
<span style="font-size: 14px; line-height: 1.5; opacity: 0.85; min-height: 42px">{{p.for}}</span>
<div style="display: flex; flex-direction: column; gap: 11px; border-top: 1px solid {{p.divider}}; padding-top: 18px; font-size: 14px">
<span style="display: flex; justify-content: space-between"><span style="opacity: 0.75">Users</span><span class="mono" style="font-weight: 600">{{p.u}}</span></span>
<span style="display: flex; justify-content: space-between"><span style="opacity: 0.75">Projects</span><span class="mono" style="font-weight: 600">{{p.pr}}</span></span>
<span style="display: flex; justify-content: space-between"><span style="opacity: 0.75">Leads</span><span class="mono" style="font-weight: 600">{{p.l}}</span></span>
</div>
<a class="{{p.btn}}" href="signup.html" style="margin-top: auto; width: 100%">{{p.cta}}</a>
</div>
</sc-for>
</div>
<p style="text-align: center; font-size: 13.5px; color: var(--sub); margin: 26px 0 0">Prices in INR. [Confirm whether prices are exclusive of GST before launch.]</p>
</section>

<!-- ESTIMATOR -->
<section class="on-navy" style="padding: 104px 24px; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; width: 700px; height: 700px; left: -200px; bottom: -420px; border-radius: 50%; background: radial-gradient(circle, rgba(255,95,0,0.3), rgba(255,95,0,0) 65%)"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div class="rv" style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<span class="eyebrow">Plan finder</span>
<h2 class="h2">Tell us your size. We'll point to the plan.</h2>
<p class="lead">Move the sliders to match your team and pipeline. The smallest plan that fits all three is highlighted.</p>
</div>
<div class="rv" style="flex: 1.2 1 520px; min-width: 0; background: var(--surf); border: 1px solid var(--line); border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.7)">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="eu" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>Users on the CRM</span><span class="mono">{{eu}}</span></label><input id="eu" type="range" min="1" max="200" value="{{eu}}" onInput="{{setU}}" onChange="{{setU}}"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="ep" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>Live projects</span><span class="mono">{{ep}}</span></label><input id="ep" type="range" min="1" max="100" value="{{ep}}" onInput="{{setP}}" onChange="{{setP}}"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="el" style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>Leads</span><span class="mono">{{elL}}</span></label><input id="el" type="range" min="0" max="40" value="{{elIdx}}" onInput="{{setL}}" onChange="{{setL}}"></div>
<div class="swap" style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; justify-content: space-between; padding: 22px; border-radius: 18px; background: {{recBg}}; border: 1px solid {{recBorder}}">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--sub)">RECOMMENDED</span><span style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em">{{rec.n}}</span><span style="font-size: 13.5px; color: var(--mut)">{{rec.why}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span class="mono num" style="font-size: 26px; font-weight: 700">{{rec.price}}</span><span style="font-size: 12.5px; color: var(--sub)">{{rec.per}}</span></span>
</div>
</div>
</div>
</section>

<!-- COMPARE -->
<section style="padding: 104px 24px 80px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">
<div class="rv" style="display: flex; flex-direction: column; gap: 16px"><span class="eyebrow">Compare</span><h2 class="h2">Every plan, side by side.</h2></div>
<div class="card rv" style="overflow-x: auto">
<div style="min-width: 860px">
<div style="display: grid; grid-template-columns: 1.4fr repeat(5, minmax(0, 1fr)); gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--surf2); font-size: 14px; font-weight: 750">
<span style="color: var(--sub); font-size: 12px; letter-spacing: 0.08em">PLAN</span>
<sc-for list="{{cols}}" as="c" hint-placeholder-count="5"><span style="color: {{c.c}}">{{c.n}}</span></sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div class="row" style="display: grid; grid-template-columns: 1.4fr repeat(5, minmax(0, 1fr)); gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); font-size: 14.5px; transition: background .2s">
<span style="font-weight: 600">{{r.l}}</span>
<sc-for list="{{r.v}}" as="v" hint-placeholder-count="5"><span class="mono" style="font-size: 13.5px">{{v}}</span></sc-for>
</div>
</sc-for>
<div style="display: grid; grid-template-columns: 1.4fr repeat(5, minmax(0, 1fr)); gap: 12px; padding: 16px 24px; font-size: 13.5px; color: var(--sub)">
<span style="font-weight: 600; color: var(--ink)">Modules per plan</span>
<span style="grid-column: span 5">[Confirm which modules each plan includes — not yet specified]</span>
</div>
</div>
</div>
</div>
</section>

<!-- FAQ -->
<section style="padding: 40px 24px 104px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 64px">
<div class="rv" style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px"><span class="eyebrow">Billing questions</span><h2 class="h2">Before you choose.</h2></div>
<div style="flex: 2 1 520px; min-width: 0; border-top: 1px solid var(--line)">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="4">
<div style="border-bottom: 1px solid var(--line)">
<button class="faq-q" onClick="{{f.toggle}}" aria-expanded="{{f.exp}}"><span>{{f.q}}</span><svg class="chev" data-on="{{f.on}}" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg></button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}"><p class="swap" style="margin: 0; padding: 0 40px 24px 0; font-size: 16px; line-height: 1.65; color: var(--mut)">{{f.a}}</p></sc-if>
</div>
</sc-for>
</div>
</div>
</section>

<section style="padding: 0 24px 96px">
<div class="on-navy rv" style="max-width: 1240px; margin: 0 auto; border-radius: 32px; padding: 72px 48px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; width: 520px; height: 520px; right: -120px; top: -260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,95,0,0.35), rgba(255,95,0,0) 65%)"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 640px"><h2 class="h2">Running more than 100 projects?</h2><p class="lead">Talk to us about limits beyond Enterprise and onboarding for group companies.</p></div>
<a class="bp" href="company.html" style="position: relative; padding: 15px 26px; font-size: 16px">Talk to sales</a>
</div>
</section>

<footer style="border-top: 1px solid var(--line); padding: 40px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--sub)"><span>© 2026 DeedFlow. All rights reserved.</span><span style="display: flex; gap: 20px"><a class="nl" href="index.html">Home</a><a class="nl" href="features.html">Product</a><a class="nl" href="compliance.html">Compliance</a><a class="nl" href="company.html">Contact</a></span></div>
</footer>

</div>
</template>

<script src="js/runtime.js"></script>
<script src="js/pricing.js"></script>
</body>
</html>
