<button class="bp" onClick="{{h1Submit}}" style="width: 100%; padding: 15px 20px; font-size: 16px; margin-top: 4px">Get my free demo
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--sub); justify-content: center">
<span style="display: inline-flex; align-items: center; gap: 5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acct)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"></path></svg>Reply within 1 working day</span>
<span style="display: inline-flex; align-items: center; gap: 5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acct)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4"></path></svg>Data stays in India</span>
<span style="display: inline-flex; align-items: center; gap: 5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acct)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6M3 3l18 18"></path></svg>No spam</span>
</div>
</sc-if>
<sc-if value="{{f1Done}}" hint-placeholder-val="{{ false }}">

<span style="width: 64px; height: 64px; border-radius: 50%; background: var(--oksoft); display: flex; align-items: center; justify-content: center"><svg class="chk" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>

</div>
</sc-for>
</div>
</div>

<div class="rv" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px"><div style="display: flex; flex-direction: column; gap: 16px; max-width: 680px"><span class="eyebrow">Guides for developers</span><h2 class="h2">Know the rules before your next launch.</h2></div><span class="pill p-mut">Coming soon</span></div>

<div aria-hidden="true" style="height: 168px; position: relative; overflow: hidden; background: {{p.bg}}; display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box"><span class="mono" style="position: absolute; right: 16px; top: 8px; font-size: 64px; font-weight: 600; color: {{p.fg}}; opacity: 0.35; letter-spacing: -0.04em">{{p.mark}}</span><span class="pill" style="background: rgba(255,255,255,0.9); color: #0a1628">{{p.tag}}</span></div>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 12px; flex: 1"><span style="font-size: 18.5px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.3">{{p.t}}</span><span style="font-size: 14px; color: var(--mut); line-height: 1.55">{{p.d}}</span><span style="margin-top: auto; font-size: 12.5px; color: var(--sub)">{{p.meta}}</span></div>
</div>
</sc-for>
</div>
</div>
</section>

<!-- CTA -->

<div aria-hidden="true" style="position: absolute; width: 900px; height: 900px; left: 60%; top: -520px; margin-left: -450px; border-radius: 50%; border: 1px solid rgba(255,95,0,0.35)"></div>
<div aria-hidden="true" style="position: absolute; width: 520px; height: 520px; left: -160px; bottom: -380px; border-radius: 50%; background: radial-gradient(circle, rgba(255,95,0,0.35), rgba(255,95,0,0) 65%)"></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label class="lbl" for="c-ph">Mobile</label><input id="c-ph" class="inp" data-err="{{e2.phone}}" inputmode="tel" placeholder="+91" value="{{f2.phone}}" onInput="{{h2Phone}}"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label class="lbl" for="c-em">Work email</label><input id="c-em" class="inp" data-err="{{e2.email}}" type="email" placeholder="you@developer.in" value="{{f2.email}}" onInput="{{h2Email}}"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">I am interested in</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{intOpts}}" as="o" hint-placeholder-count="4"><button class="chip" data-on="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<sc-if value="{{f2Err}}" hint-placeholder-val="{{ false }}"><span class="swap" style="font-size: 13px; color: var(--bad); font-weight: 600">Please fill your name, a 10-digit mobile number and a valid work email.</span></sc-if>
<button class="bp" onClick="{{h2Submit}}" style="width: 100%; padding: 14px 20px; font-size: 15.5px">Call me back</button>
<span style="font-size: 12.5px; color: var(--sub); text-align: center">We reply within one working day. Data stays in India.</span>
</sc-if>
<sc-if value="{{f2Done}}" hint-placeholder-val="{{ false }}">
<div class="ok-anim" style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 20px 8px">
<span style="width: 56px; height: 56px; border-radius: 50%; background: var(--oksoft); display: flex; align-items: center; justify-content: center"><svg class="chk" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Got it, {{f2.name}}.</span>
<span style="font-size: 14.5px; color: var(--mut); line-height: 1.55">We'll call <strong style="color: var(--ink)">{{f2.phone}}</strong> within one working day.</span>
<button class="nl" onClick="{{h2Reset}}" style="background: none; border: 0; cursor: pointer; font-family: inherit; font-size: 13px">Submit another request</button>
</div>
</sc-if>
</div>
</div>
</div>
</section>
