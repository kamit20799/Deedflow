<nav class="hide-m" aria-label="Main" style="display: flex; gap: 28px; font-size: 14.5px; font-weight: 500">

<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--accsoft); color: var(--acct)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Developer team</span><span style="font-size: 12.5px; color: var(--sub)">Sales, presales, CRM and accounts</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--oksoft); color: var(--ok)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Channel partner</span><span style="font-size: 12.5px; color: var(--sub)">Brokers and their agents</span></span></a>
<a class="lm" role="menuitem" href="#"><span class="lmi" style="background: var(--bluesoft); color: var(--blue)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14.5px">Home buyer</span><span style="font-size: 12.5px; color: var(--sub)">Booking, payments and documents</span></span></a>
<div style="border-top: 1px solid var(--line); margin-top: 6px; padding: 12px 12px 6px; font-size: 13px; color: var(--mut)">New to DeedFlow? <a href="signup.html" style="font-weight: 650">Start free trial →</a></div>
</div>
</sc-if>
</div>
<a class="nl hide-m" href="company.html" style="font-weight: 600; font-size: 14.5px">Book a demo</a>
<a class="bp" href="signup.html" style="padding: 11px 18px; font-size: 14.5px">Start free trial</a>
</div>

<div style="position: relative; max-width: 1240px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 26px">

<span>Section 13 booking cap, enforced at receipt entry</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
<h1 class="in d1" style="margin: 0; font-size: clamp(40px, 5.8vw, 76px); line-height: 1.02; letter-spacing: -0.045em; font-weight: 800; max-width: 1200px; text-wrap: balance">Sell every unit.<br>Stay <span class="ul">compliant</span> on every rupee.</h1>
<p class="lead in d2" style="max-width: 720px; font-size: 19px">DeedFlow is the CRM that runs an Indian developer's whole sales floor — portal leads, presales calls, site visits, cost sheets, bookings and collections — with RERA, GST, TDS and a strict audit trail built into the money flow.</p>
<div class="in d3 stack-m" style="display: flex; gap: 14px; align-items: center; margin-top: 6px">
<a class="bp" href="signup.html" style="padding: 17px 30px; font-size: 16.5px; border-radius: 14px; box-shadow: 0 14px 30px -12px rgba(255,95,0,0.65)">Start free trial
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a class="bs" href="company.html" style="padding: 16px 26px; font-size: 16.5px; border-radius: 14px; gap: 10px"><span style="width: 26px; height: 26px; border-radius: 50%; background: var(--accsoft); display: inline-flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="var(--acct)" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></span>Book a demo</a>
</div>
<div class="in d4" style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 14px; font-size: 13.5px; color: var(--sub)">

</div>
</div>

<!-- HERO PRODUCT MOCK -->
<div style="position: relative; max-width: 1180px; margin: 68px auto 0">
<div class="tiltin" style="border: 1px solid var(--line); border-radius: 20px; background: var(--surf); box-shadow: var(--shadow), 0 60px 120px -40px rgba(10,22,40,0.35); overflow: hidden; text-align: left">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surf2)">

<div class="mono" style="flex: 1; max-width: 360px; margin: 0 auto; font-size: 12px; color: var(--sub); background: var(--surf); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; text-align: center">crm › leads › today</div>
<span class="pill p-ok hide-m"><span class="dotg"></span>Live</span>

</sc-for>

<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<div style="font-size: 20px; font-weight: 750; letter-spacing: -0.02em">Leads</div>
<div style="display: flex; gap: 4px; background: var(--bg2); padding: 3px; border-radius: 10px; font-size: 12.5px; font-weight: 600">
<span style="padding: 5px 11px; border-radius: 8px; background: var(--surf); box-shadow: 0 1px 2px rgba(0,0,0,.08)">All</span><span style="padding: 5px 11px; color: var(--acct)">HOT</span><span style="padding: 5px 11px; color: var(--warn)">WARM</span><span style="padding: 5px 11px; color: var(--sub)">COLD</span>

<span style="font-size: 24px; font-weight: 750; letter-spacing: -0.02em">{{k.v}}</span>

<span><span class="pill {{r.tone}}">{{r.pri}}</span></span>

<div style="display: flex; align-items: center; justify-content: space-between"><span class="pill p-ok"><span class="dotg"></span>On call</span><span class="mono" style="font-size: 13px; font-weight: 600">{{callTime}}</span></div>

<span style="display: flex; flex-direction: column"><span style="font-weight: 650; font-size: 14px">Priya Sharma</span><span style="font-size: 12px; color: var(--sub)">3 BHK · Tower B · HOT</span></span>
</div>
<div class="bar" aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 22px">
<span style="height: 60%; animation-delay: 0s"></span><span style="height: 100%; animation-delay: .1s"></span><span style="height: 70%; animation-delay: .2s"></span><span style="height: 90%; animation-delay: .3s"></span><span style="height: 50%; animation-delay: .4s"></span><span style="height: 80%; animation-delay: .15s"></span><span style="height: 100%; animation-delay: .25s"></span><span style="height: 60%; animation-delay: .35s"></span><span style="height: 85%; animation-delay: .05s"></span><span style="height: 70%; animation-delay: .45s"></span><span style="height: 95%; animation-delay: .2s"></span><span style="height: 55%; animation-delay: .3s"></span><span style="height: 75%; animation-delay: .1s"></span><span style="height: 100%; animation-delay: .4s"></span>
</div>
<div style="font-size: 11.5px; color: var(--sub); display: flex; align-items: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Recording with consent · AI analysis on hang-up</div>
</div>

<!-- floating: RERA cap -->
<div class="float2 hide-m" style="position: absolute; right: -40px; top: -44px; width: 290px; background: var(--surf); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--acct)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>RERA §13 · BOOKING CAP</div>
<div style="font-size: 13.5px; font-weight: 600">Unit B-1204 · Advance before agreement</div>
<div style="height: 8px; border-radius: 8px; background: var(--bg2); overflow: hidden"><span style="display: block; height: 100%; width: 94%; background: linear-gradient(90deg, #ff9a3d, #ff5f00); border-radius: 8px"></span></div>
<div class="mono" style="display: flex; justify-content: space-between; font-size: 12px; color: var(--mut)"><span>₹9,20,000</span><span>cap ₹9,80,000 (10%)</span></div>
<div style="font-size: 12px; color: var(--warn); font-weight: 600">Next receipt needs a registered agreement</div>
</div>

<!-- floating: receipt -->
<div class="float hide-m" style="position: absolute; right: 60px; bottom: -28px; background: #0a1628; color: #edf1f7; border-radius: 16px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; align-items: center; gap: 12px; text-align: left; animation-delay: 2s">
<span style="width: 34px; height: 34px; border-radius: 10px; background: rgba(69,214,154,0.15); display: flex; align-items: center; justify-content: center"><svg class="chk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#45d69a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 13.5px; font-weight: 650">Receipt cleared · ₹4,85,000</span><span style="font-size: 11.5px; color: #a9b5c6">Ledger posted · Dr Bank / Cr Customer</span></span>
</div>
</div>

<div class="marq-wrap" style="overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent)">

</sc-for>
</div>
</div>

</div>

</div>
<div class="rv" style="position: relative">
